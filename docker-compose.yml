services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local_root_dev_only_change_me
      MYSQL_DATABASE: assistanthub
      MYSQL_USER: assistanthub
      MYSQL_PASSWORD: local_dev_only_change_me
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - assistanthub_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  assistanthub_mysql:
