name: Dependency security assessment (report only)

on:
  pull_request:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/dependency-security-assessment.mjs'
      - 'scripts/dependency-security-assessment.check.mjs'
      - '.github/workflows/dependency-security-assessment.yml'
      - 'docs/security-dependency-assessment-2026-11-18.md'
      - 'docs/dependency-triage-2026-11-18.md'
      - 'api/package.json'
      - 'api/package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-report:
    name: Generate dependency audit report (not a security gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Test audit report parser
        run: node --test scripts/dependency-security-assessment.check.mjs

      - name: Audit frontend all and production-only dependencies
        run: node scripts/dependency-security-assessment.mjs

      - name: Audit API all and production-only dependencies
        run: node scripts/dependency-security-assessment.mjs --api
