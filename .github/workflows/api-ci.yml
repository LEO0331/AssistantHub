name: API CI (Express and MySQL)

on:
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - "docker-compose.yml"
      - ".github/workflows/api-ci.yml"
      - "src/services/workflowApi.js"
      - "src/features/CandidateWorkflowPanel.jsx"
      - "docs/architecture-v2.md"
      - "docs/api-contract.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: assistanthub_test
      DB_USER: assistanthub_test
      DB_PASSWORD: ci_local_only_password
      NODE_ENV: test
      AUTH_JWT_SECRET: ci_only_jwt_signing_secret_do_not_use_outside_tests_12345
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_local_only_root_password
          MYSQL_DATABASE: assistanthub_test
          MYSQL_USER: assistanthub_test
          MYSQL_PASSWORD: ci_local_only_password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci_local_only_root_password --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install exact API lockfile
        run: npm ci --prefix api
      - name: Validate API JavaScript syntax
        run: npm run check --prefix api
      - name: Run migrations twice (idempotence)
        run: |
          npm run db:migrate --prefix api
          npm run db:migrate --prefix api
      - name: Insert synthetic data twice (idempotence)
        run: |
          npm run db:seed --prefix api
          npm run db:seed --prefix api
      - name: Test health and database integration
        run: npm test --prefix api
      - name: Enforce API production dependency audit
        run: npm audit --omit=dev --audit-level=high --prefix api

      - name: Report all API dependency findings (diagnostic, not a gate)
        shell: bash
        run: |
          npm audit --json --audit-level=low --prefix api > "$RUNNER_TEMP/assistanthub-api-audit.json" || true
          node --input-type=module -e '
            import fs from "node:fs";
            const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/assistanthub-api-audit.json", "utf8"));
            const counts = report.metadata?.vulnerabilities;
            if (report.error || !counts || !Number.isInteger(counts.total)) {
              console.error("API npm audit unavailable; cannot classify findings");
              process.exitCode = 1;
            } else {
              const names = Object.keys(report.vulnerabilities ?? {});
              const detail = "API npm audit (all dependencies): " + counts.total + " affected packages; " +
                (counts.high ?? 0) + " high, " + (counts.moderate ?? 0) + " moderate.";
              console.log(detail);
              if (counts.total) console.log("::warning::" + detail + " Development-time findings are NOT fixed.");
              if (process.env.GITHUB_STEP_SUMMARY) {
                fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
                  "## API dependency assessment (report only)\n\n" + detail +
                  "\n\nAffected packages: " + names.join(", ") +
                  "\n\nThis is not the blocking production audit. No vulnerability was dismissed.\n");
              }
            }
          '
